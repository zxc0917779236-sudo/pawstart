<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PawStart 毛孩好起點｜飼養適配評估原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#E8EEEA;--surface:#FBFCFA;--surface2:#F0F4F1;--ink:#17312F;--body:#3B504E;--muted:#5D6E6B;
  --line:#D2DCD7;--brand:#1F4A45;--brandInk:#F4F8F6;--amber:#E39B45;--amberInk:#2A1A06;
  --low:#2A7362;--mid:#A3600F;--high:#A9361F;--chip:#E1EAE5;--chipOn:#1F4A45;--chipOnInk:#F4F8F6;
  --chatbg:#DAE5DF;--bot:#FFFFFF;--me:#CDEAD7;--sys:#FFF6EA;--sysLine:#E9C79A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1918;--surface:#162523;--surface2:#1C2D2B;--ink:#E6EFEB;--body:#C2D2CD;--muted:#94A6A1;
    --line:#2B3F3C;--brand:#8FCFC2;--brandInk:#0E1918;--amber:#E9AA5E;--amberInk:#2A1A06;
    --low:#6CC4AE;--mid:#E6A650;--high:#F2836E;--chip:#213532;--chipOn:#8FCFC2;--chipOnInk:#0E1918;
    --chatbg:#111F1D;--bot:#203230;--me:#2A5243;--sys:#2B2418;--sysLine:#6E5530;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1918;--surface:#162523;--surface2:#1C2D2B;--ink:#E6EFEB;--body:#C2D2CD;--muted:#94A6A1;
  --line:#2B3F3C;--brand:#8FCFC2;--brandInk:#0E1918;--amber:#E9AA5E;--amberInk:#2A1A06;
  --low:#6CC4AE;--mid:#E6A650;--high:#F2836E;--chip:#213532;--chipOn:#8FCFC2;--chipOnInk:#0E1918;
  --chatbg:#111F1D;--bot:#203230;--me:#2A5243;--sys:#2B2418;--sysLine:#6E5530;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',Arial,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brandInk)}
.bar{max-width:520px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:20px;letter-spacing:.01em}
.logo small{font-weight:500;font-size:14px;margin-left:6px;opacity:.85}
.mode{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--amber);color:var(--amberInk)}

main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.panel{background:var(--surface);border-radius:22px;padding:24px 22px;border:1px solid var(--line)}
h1{font-size:30px;line-height:1.3;margin:0 0 12px;font-weight:900}
h2{font-size:22px;line-height:1.35;margin:0 0 6px;font-weight:900}
h3{font-size:17px;margin:0 0 8px;font-weight:700}
p{margin:0 0 12px;color:var(--body)}
.muted{color:var(--muted);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px;background:var(--brand);color:var(--brandInk)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.row{display:flex;gap:10px}
.row .btn{flex:1}

.hero-paw{font-size:44px;line-height:1;margin-bottom:12px}
.promises{list-style:none;padding:0;margin:18px 0 22px;display:grid;gap:10px}
.promises li{background:var(--surface2);border-radius:14px;padding:12px 14px;color:var(--body);font-size:15px}
.promises b{color:var(--ink)}

.progress{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 18px}
.progress span{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s ease}
.stepno{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field{margin:18px 0 0}
.field label,.field .lab{display:block;font-weight:700;font-size:15px;margin-bottom:8px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn);font-weight:700}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit}
.nav{margin-top:26px}

.loading{text-align:center;padding:48px 22px}
.dots{display:inline-flex;gap:8px;margin:12px 0 18px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--amber);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4}
.tab{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:9px 2px;font-size:13px;font-weight:700}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brandInk)}

.scorebox{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:34px;line-height:1;font-weight:900}
.ring .val span{font-size:12px;color:var(--muted)}
.level{display:inline-block;font-weight:900;font-size:15px;padding:3px 12px;border-radius:999px;margin-bottom:8px;color:#fff}
.lv-low{background:var(--low)}.lv-mid{background:var(--mid)}.lv-high{background:var(--high)}
:root[data-theme="dark"] .level{color:#0E1918}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .level{color:#0E1918}}
.dims{display:grid;gap:12px;margin-top:18px}
.dim .top{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.dim .top span:last-child{color:var(--muted);font-weight:500}
.meter{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:5px 0 3px}
.meter span{display:block;height:100%;border-radius:99px}
.dim small{color:var(--muted);font-size:13px}
.sect{margin-top:16px}
.risk{border-left:5px solid var(--high);background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:10px}
.risk h3{margin-bottom:4px}
.risk p{margin:0;font-size:15px}
.sugg{margin:8px 0 0;padding-left:20px;color:var(--body)}
.sugg li{margin:6px 0}

.cat{margin-top:12px;background:var(--surface2);border-radius:14px;padding:14px}
.cat ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.cat li label{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--body)}
.cat input{margin-top:5px;width:18px;height:18px;accent-color:var(--brand)}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted)}
td.n{white-space:nowrap;font-weight:700;color:var(--ink)}
td small{color:var(--muted)}
.budget{margin-top:16px;border-radius:14px;padding:14px;background:var(--surface2)}
.budget .verdict{font-weight:700;margin:6px 0 0}

.chat{background:var(--chatbg);border-radius:18px;padding:14px;min-height:260px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap}
.msg.bot{background:var(--bot);color:var(--ink);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--me);color:var(--ink);border-top-right-radius:4px;align-self:flex-end}
.msg .who{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.sys{align-self:stretch;background:var(--sys);border:1.5px dashed var(--sysLine);border-radius:14px;padding:10px 13px;font-size:14px;color:var(--body)}
.sys b{color:var(--ink)}
.sys .tagline{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.days{display:flex;gap:8px;margin:12px 0}
.days .chip{flex:1;text-align:center}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.quick .chip{font-size:13px;padding:6px 11px}
.composer{display:flex;gap:8px;margin-top:8px}
.composer input{flex:1}
.composer .btn{width:auto;padding:10px 16px;font-size:15px}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
.err{color:var(--high);font-size:14px;margin-top:8px}
.guide details{background:var(--surface2);border-radius:14px;padding:2px 14px;margin-top:10px}
.guide summary{cursor:pointer;font-weight:700;font-size:16px;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;color:var(--ink)}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"＋";color:var(--muted)}
.guide details[open] summary::after{content:"－"}
.guide ul{margin:0 0 12px;padding-left:20px;color:var(--body);font-size:15px}
.guide li{margin:6px 0}
.guide a{color:var(--brand);font-weight:700}
.match{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:10px;border-left:5px solid var(--low)}
.match h3{margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.match p{margin:0;font-size:15px}
.adopt-tag{font-size:12px;font-weight:700;background:var(--amber);color:var(--amberInk);border-radius:999px;padding:1px 9px}
.viewbtn{border:1.5px solid var(--brandInk);background:transparent;color:var(--brandInk);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
body.wide main,body.wide .bar{max-width:1000px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-size:28px;font-weight:900;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.case{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:18px;padding:14px 18px;margin-top:12px}
.case.c-high{border-left-color:var(--high)}.case.c-mid{border-left-color:var(--mid)}.case.c-low{border-left-color:var(--low)}
.case .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case .cid{font-weight:900;font-size:17px}
.case .level{font-size:12px;margin:0;padding:1px 9px}
.status{margin-left:auto;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink)}
.status.todo{background:var(--sys);border:1.5px solid var(--sysLine)}
.tag-now{font-size:12px;font-weight:700;background:var(--amber);color:var(--amberInk);border-radius:999px;padding:1px 8px}
.meta{font-size:14px;color:var(--muted);margin:6px 0 4px}
.sig{font-size:14px;color:var(--body);margin:0 0 4px}
.task{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--body);margin:8px 0}
.task b{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions .btn{width:auto;padding:8px 14px;font-size:14px}
.case details{margin-top:8px}
.case summary{font-size:13px;color:var(--muted);cursor:pointer}
.case details ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--body)}
.script{margin-top:8px;border:1.5px dashed var(--sysLine);background:var(--sys);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--body)}
.script ul{margin:4px 0;padding-left:18px}
.script b{color:var(--ink)}
.sys .btn{width:auto;padding:6px 12px;font-size:13px;margin-top:8px}
select{width:100%;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit}
.res{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:10px;border:2px solid transparent}
.res.hl{border-color:var(--amber)}
.res h3{margin:0 0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.res p{margin:2px 0;font-size:14px}
.res .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.res .links a{font-size:14px;font-weight:700;color:var(--brand);border:1.5px solid var(--brand);border-radius:999px;padding:5px 12px;text-decoration:none}
.hl-tag{font-size:12px;font-weight:700;background:var(--amber);color:var(--amberInk);border-radius:999px;padding:1px 8px}
.consent{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.consent h3{font-size:16px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--body);margin:10px 0}
.ck input{margin-top:4px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.consent .field{margin-top:12px}
.notice-box{background:var(--surface2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--body);margin-top:10px}
.notice-box summary{cursor:pointer;font-weight:700;color:var(--ink)}
.notice-box ol{margin:8px 0 0;padding-left:20px}
.notice-box li{margin:4px 0}
.saved{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.hotline{margin-top:14px;border-radius:14px;padding:12px 14px;background:var(--sys);border:1.5px dashed var(--sysLine);font-size:14px;color:var(--body)}
.hotline b{color:var(--ink)}
.src{font-size:12px;color:var(--muted);margin-top:12px}

.notice{background:var(--surface2);border-left:5px solid var(--amber);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--body);margin:0 0 16px}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">PawStart<small>毛孩好起點</small></div><span class="mode" id="mode">公開示範版</span><button class="viewbtn" id="viewBtn" type="button">門市端</button></div></header>
<main id="app" aria-live="polite"></main>

<script>
(function(){
"use strict";
const STEPS = [
  {title:"想養的毛孩", hint:"先說說你想帶回家的是誰。", fields:[
    {k:"species", label:"種類", type:"single", opts:["狗","貓"]},
    {k:"breed", label:"品種或類型（選填）", type:"text", ph:"例：柴犬、米克斯、還沒決定"},
    {k:"age", label:"年齡", type:"single", opts:["幼年（1 歲以下）","成年","高齡（7 歲以上）"]}
  ]},
  {title:"居住環境", hint:"住的地方，決定毛孩能不能安穩待下來。", fields:[
    {k:"housing", label:"目前住處", type:"single", opts:["租屋","自有住宅","與家人同住"]},
    {k:"space", label:"空間大小", type:"single", opts:["套房","公寓","有庭院的透天"]},
    {k:"landlord", label:"房東或家人同意養嗎？", type:"single", opts:["已經同意","還沒確認","不需要詢問"]},
    {k:"county", label:"居住縣市", type:"select"}
  ]},
  {title:"時間與陪伴", hint:"照實回答就好，這不是考試。", fields:[
    {k:"companion", label:"每天能專心陪伴的時間", type:"single", opts:["不到 1 小時","1–3 小時","3 小時以上"]},
    {k:"away", label:"平日家裡沒人的時間", type:"single", opts:["6 小時以內","6–10 小時","10 小時以上"]}
  ]},
  {title:"經濟準備", hint:"第一年通常是花費最多的一年。", fields:[
    {k:"monthly", label:"每月願意為毛孩花費", type:"single", opts:["2,000 元以下","2,000–4,000 元","4,000 元以上"]},
    {k:"emergency", label:"有沒有緊急醫療預備金？", type:"single", opts:["有，至少 1 萬元","還沒有"]}
  ]},
  {title:"家庭成員", hint:"一起住的人，都會是毛孩的家人。", fields:[
    {k:"members", label:"同住成員（可複選）", type:"multi", opts:["獨居","伴侶或室友","幼兒","長輩","其他寵物"], excl:["獨居"]},
    {k:"consent", label:"大家都同意養嗎？", type:"single", opts:["大家都同意","還有人不確定"]},
    {k:"allergy", label:"家中有人對貓狗過敏嗎？", type:"single", opts:["沒有","有","不確定"]}
  ]},
  {title:"經驗與未來規劃", hint:"毛孩會陪你 10 年以上，想想接下來的生活。", fields:[
    {k:"experience", label:"飼養經驗", type:"single", opts:["第一次養","以前養過"]},
    {k:"changes", label:"未來一年可能的生活變動（可複選）", type:"multi", opts:["搬家","結婚或新生兒","換工作","出國或長期外派","都沒有"], excl:["都沒有"]}
  ]}
];
const DIMS = ["時間陪伴","居住環境","經濟準備","家庭共識","經驗與變動"];
const CHECKINS = {
  7:"嗨！毛孩來家裡一週了 🐾\n吃飯、睡覺、上廁所都還順利嗎？有沒有讓你頭痛的地方？",
  30:"一個月了！這段時間的花費，跟你原本預期的差不多嗎？\n毛孩有沒有出現吠叫、破壞或亂尿尿的狀況？",
  90:"三個月了，最近生活有什麼變化嗎？例如工作、住處或家裡成員。\n毛孩跟大家相處得如何？"
};
const QUICK = ["都很順利，牠很快就適應了","牠白天一直叫，鄰居來抗議了","下個月要搬家，新房東不讓養","開銷比想像多很多，有點吃不消"];

const app = document.getElementById("app");
const modeEl = document.getElementById("mode");
let A = {members:[], changes:[]};
let step = -1, tab = "result", result = null, usedAI = false;
let chat = [], chatDay = null, chatBusy = false;
let sample = null, aiBlocked = false;

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(s => { sample = s; setMode(); }).catch(() => {});
}
function setMode(){
  if (result) modeEl.textContent = usedAI ? "AI 判讀" : "規則示範模式";
  else modeEl.textContent = (sample && !aiBlocked) ? "AI 已連線" : "公開示範版";
}
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function clear(){ app.replaceChildren(); document.body.classList.toggle("wide", view==="store"); window.scrollTo(0,0); }

/* ---------- Welcome ---------- */
function renderWelcome(){
  clear();
  app.append(el("div",{class:"panel"},
    el("div",{class:"hero-paw","aria-hidden":"true"},"🐾"),
    el("h1",{text:"帶毛孩回家前，花 5 分鐘確認你們合不合拍"}),

function stepDone(s){
  if (s===STEPS.length-1 && SHEET_ENDPOINT && !consentOk()) return false;
  return STEPS[s].fields.every(f => f.type==="text" || (f.type==="multi" ? (A[f.k]||[]).length>0 : !!A[f.k]));
}
function renderStep(){
  clear();
  const S = STEPS[step];
  const panel = el("div",{class:"panel"},
    el("div",{class:"stepno",text:`第 ${step+1} 步，共 ${STEPS.length} 步`}),
    el("div",{class:"progress",role:"progressbar","aria-valuemin":"0","aria-valuemax":String(STEPS.length),"aria-valuenow":String(step+1)}, el("span",{style:`width:${(step+1)/STEPS.length*100}%`})),
    el("h2",{text:S.title}),
    el("p",{class:"muted",text:S.hint})
  );
  const next = el("button",{class:"btn",onclick:()=>{ if(step<STEPS.length-1){step++;renderStep();} else evaluate(); }}, step<STEPS.length-1 ? "下一步" : "看評估結果");
  const refresh = () => { next.disabled = !stepDone(step); };
  for (const f of S.fields){
    const wrap = el("div",{class:"field"});
    if (f.type === "select"){
      const id = "f_"+f.k;

      sel.addEventListener("change",()=>{ A[f.k]=sel.value; refresh(); });
      wrap.append(el("label",{for:id,text:f.label}), sel);
    } else if (f.type === "text"){
      const id = "f_"+f.k;
      const inp = el("input",{type:"text",id,placeholder:f.ph||"",maxlength:"30",value:A[f.k]||""});
      inp.addEventListener("input",()=>{A[f.k]=inp.value.trim();});
      wrap.append(el("label",{for:id,text:f.label}), inp);
    } else {
      const chips = el("div",{class:"chips",role:"group","aria-label":f.label});
      const paint = () => chips.querySelectorAll(".chip").forEach(c=>{
        const on = f.type==="multi" ? (A[f.k]||[]).includes(c.dataset.v) : A[f.k]===c.dataset.v;
        c.setAttribute("aria-pressed", on ? "true" : "false");
      });
      for (const o of f.opts){
        const c = el("button",{type:"button",class:"chip","data-v":o,"aria-pressed":"false"},o);
        c.addEventListener("click",()=>{
          if (f.type==="single") A[f.k]=o;
          else {
            let cur = A[f.k] ? A[f.k].slice() : [];
            if (cur.includes(o)) cur = cur.filter(x=>x!==o);
            else if (f.excl && f.excl.includes(o)) cur = [o];
            else { cur = cur.filter(x=>!(f.excl||[]).includes(x)); cur.push(o); }
            A[f.k]=cur;
          }
          paint(); refresh();
        });
        chips.append(c);
      }
      paint();
      wrap.append(el("span",{class:"lab",text:f.label}), chips);
    }
    panel.append(wrap);
  }
  const back = el("button",{class:"btn ghost",onclick:()=>{ if(step>0){step--;renderStep();} else renderWelcome(); }},"上一步");

/* ---------- Rule engine (always computed; also the fallback) ---------- */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));
function levelOf(s){ return s>=75 ? "低風險" : s>=55 ? "中風險" : "高風險"; }
function ruleEval(a){
  const dog = a.species==="狗", young = (a.age||"").startsWith("幼年"), senior=(a.age||"").startsWith("高齡");
  let t = {"不到 1 小時":40,"1–3 小時":75,"3 小時以上":95}[a.companion] ?? 60;
  let awayPen = {"6 小時以內":0,"6–10 小時":10,"10 小時以上":25}[a.away] ?? 0;
  if (!dog) awayPen = Math.round(awayPen/2);
  if (young && a.away==="10 小時以上") awayPen += 10;
  t -= awayPen;
  let l = {"租屋":80,"自有住宅":95,"與家人同住":88}[a.housing] ?? 80;
  if (a.landlord==="還沒確認") l -= 30;
  if (dog && a.space==="套房") l -= 15;
  let m = {"2,000 元以下":45,"2,000–4,000 元":75,"4,000 元以上":92}[a.monthly] ?? 60;
  if (a.emergency==="還沒有") m -= 20;
  if (senior) m -= 10;
  let f = 95;
  if (a.consent==="還有人不確定") f -= 35;
  if (a.allergy==="有") f -= 40; else if (a.allergy==="不確定") f -= 15;
  if ((a.members||[]).includes("幼兒") && dog) f -= 5;
  let e = 90;
  if (a.experience==="第一次養") e -= 15;
  e -= 15 * (a.changes||[]).filter(x=>x!=="都沒有").length;
  const scores = [t,l,m,f,e].map(v=>clamp(v,20,100));
  const score = clamp(scores.reduce((s,v)=>s+v,0)/scores.length,0,100);
  const comments = [
    scores[0]>=75?"陪伴時間充足":"獨處時間偏長，需規劃照顧方式",
    scores[1]>=75?"居住條件穩定":"住處限制可能影響長期飼養",
    scores[2]>=75?"預算準備充足":"預算或緊急預備金不足",
    scores[3]>=75?"家人意見一致":"家中共識或過敏問題待確認",
    scores[4]>=75?"生活規劃穩定":"經驗或生活變動需提前規劃"
  ];
  const RISK = [
    {title:"陪伴時間不足", reason: dog ? "狗狗需要固定散步與陪伴，長時間獨處容易出現吠叫、破壞等行為問題。" : "貓咪雖較能獨處，仍需要每天互動與玩耍，長期孤單可能影響健康與情緒。"},
    {title:"住處尚未確認", reason:"租屋若未取得房東同意，或空間與毛孩需求落差大，日後搬家或被要求送走的風險較高。"},
    {title:"預算吃緊", reason:"第一年包含疫苗、結紮、用品等一次性支出，加上突發醫療，預算不足時最容易陷入兩難。"},
    {title:"家人尚未有共識", reason:"同住家人有疑慮或有過敏狀況，帶回家後容易成為放棄飼養的主要原因。"},
    {title:"生活即將變動", reason:"未來一年若有搬家、新生兒或外派等計畫，需要先想好毛孩的安置與照顧安排。"}
  ];
  const SUG = [
    "先安排白天的照顧方式，例如安親服務、家人輪流或調整作息，再決定帶回家的時間。",
    "帶回家前先取得房東書面同意，並確認新住處與社區的飼養規定。",
    "先存下至少一萬元的緊急醫療預備金，並把第一年的一次性支出列入預算。",
    "請家人一起討論分工，若有人可能過敏，先實際接觸毛孩一段時間再決定。",
    "把未來一年的生活變動列出來，先想好每個情況下毛孩由誰照顧。"
  ];
  const order = scores.map((s,i)=>[s,i]).sort((x,y)=>x[0]-y[0]);
  const risks = order.filter(([s])=>s<75).slice(0,3).map(([,i])=>RISK[i]);
  const suggestions = order.filter(([s])=>s<75).slice(0,3).map(([,i])=>SUG[i]);
  if (suggestions.length<3) suggestions.push("帶回家第一週保持作息固定，讓毛孩熟悉環境與家人。");
  if (suggestions.length<3) suggestions.push("先預約一次健康檢查，建立毛孩的基本健康紀錄。");
  const checklist = dog ? [
    {category:"飲食",items:[young?"幼犬適用主食":senior?"高齡犬適用主食":"成犬主食","食碗與飲水器","零食或訓練獎勵"]},
    {category:"居家",items:["睡墊或睡窩","圍欄或籠子","電線與易碎物收納"]},
    {category:"外出",items:["牽繩與胸背帶","名牌","外出包或提籠"]},
    {category:"清潔",items:["尿布墊","除臭清潔用品","梳子與指甲剪"]},
    {category:"醫療與登記",items:["第一次健康檢查","預防針與驅蟲計畫","晶片植入與寵物登記"]}
  ] : [
    {category:"飲食",items:[young?"幼貓適用主食":senior?"高齡貓適用主食":"成貓主食","食碗與飲水器","濕食或零食"]},
    {category:"居家",items:["貓砂盆與貓砂","貓抓板","可躲藏的空間","窗戶與陽台防護網"]},
    {category:"外出",items:["外出提籠"]},
    {category:"清潔",items:["貓砂鏟","除臭清潔用品","梳子與指甲剪"]},
    {category:"醫療與登記",items:["第一次健康檢查","預防針與驅蟲計畫","結紮規劃"]}
  ];
  const costs = dog ? [
    {item:"飲食",low:15000,high:30000,note:"依體型差異大"},
    {item:"醫療與預防",low:8000,high:20000,note:"含預防針、驅蟲"},
    {item:"用品",low:5000,high:12000,note:"第一年一次性較多"},
    {item:"美容與訓練",low:3000,high:15000,note:"依毛量與需求"}
  ] : [
    {item:"飲食",low:10000,high:20000,note:"乾濕食比例影響大"},
    {item:"醫療與預防",low:6000,high:15000,note:"含預防針、驅蟲"},
    {item:"用品",low:6000,high:12000,note:"含貓砂消耗"},
    {item:"美容與訓練",low:0,high:5000,note:"長毛貓較高"}
  ];
  return {score, level:levelOf(score), summary: score>=75 ? "整體條件準備得不錯，留意幾個細節就能好好開始。" : score>=55 ? "大致可行，但有幾件事建議帶回家前先處理。" : "目前有幾項關鍵條件還沒到位，建議先調整再決定。",
    dimensions: DIMS.map((n,i)=>({name:n,score:scores[i],comment:comments[i]})), risks, suggestions, checklist, costs, costsIllustrative:true, matches: ruleMatches(a)};
}

function ruleMatches(a){
  const dog = a.species==="狗";
  const lowTime = a.companion==="不到 1 小時" || a.away==="10 小時以上";
  const small = a.space==="套房";
  const lowBudget = a.monthly==="2,000 元以下" || a.emergency==="還沒有";
  const first = a.experience==="第一次養";
  const kids = (a.members||[]).includes("幼兒");
  const young = (a.age||"").startsWith("幼年");
  const out = [];
  if (lowTime || (dog && small)) out.push({type:"較能獨處的成貓", reason:"成貓個性已定型，較能適應上班族的作息，空間需求也比狗狗小。", adopt:true});
  if (dog && !lowTime) out.push({type: small ? "活動量低的中小型成犬" : "作息與你相符的成犬", reason:"成犬不像幼犬需要密集的訓練與陪伴，個性也比較好預期。", adopt:true});
  if (first || kids) out.push({type:"個性穩定、親人的成年毛孩", reason: kids ? "收容所人員已觀察過牠的個性，比較能預期和小孩相處的狀況。" : "個性與習慣已經穩定，新手比較容易上手。", adopt:true});
  if (lowBudget) out.push({type:"已完成絕育與預防針的成年毛孩", reason:"幼年期的疫苗、結紮等一次性支出較多，選擇已完成基本醫療的毛孩，可降低第一年花費。", adopt:true});
  if (young && first && out.length<3) out.push({type:"一歲以上的毛孩", reason:"幼犬幼貓需要大量時間教導如廁與社會化，第一次養從成年毛孩開始會輕鬆許多。", adopt:true});
  if (!out.length) out.push({type: dog ? "你想養的狗狗類型" : "你想養的貓咪類型", reason:"你的條件和想養的毛孩大致相符，也可以考慮到收容所認識需要家的成年毛孩。", adopt:true});
  return out.slice(0,3);
}

/* ---------- AI evaluation ---------- */
function profileText(a){

    `想養：${a.species||"未填"}${a.breed?`（${a.breed}）`:""}，${a.age||"未填"}`,

function buildPrompt(a, rule){
  return `你是寵物用品門市的「飼養適配評估」助理，對象是準備帶貓狗回家的新手飼主。請用台灣繁體中文，語氣溫暖但誠實，重點放在「準備度」而不是評斷飼主。不可推薦任何品牌或特定商品，清單只寫品類。不做醫療診斷。

飼主資料：
${profileText(a)}

規則引擎參考分數（0–100，越高越適配）：
${rule.dimensions.map(d=>`${d.name}：${d.score}`).join("\n")}

請以參考分數為基礎，考慮品種或類型的特性（例如運動量、體型、是否需要大量陪伴）做合理調整，每個面向調整幅度不超過 15 分。

只回傳 JSON，不要任何其他文字或 Markdown，格式如下：
{"score":整數0-100,"summary":"一句話總結，40字內","dimensions":[{"name":"時間陪伴","score":整數,"comment":"20字內"},{"name":"居住環境","score":整數,"comment":"20字內"},{"name":"經濟準備","score":整數,"comment":"20字內"},{"name":"家庭共識","score":整數,"comment":"20字內"},{"name":"經驗與變動","score":整數,"comment":"20字內"}],"risks":[{"title":"10字內","reason":"60字內，具體說明飼主條件與毛孩需求的落差"}],"suggestions":["具體可行的建議，45字內"],"checklist":[{"category":"飲食|居家|外出|清潔|醫療與登記|陪伴與訓練","items":["品類名稱"]}],"costs":[{"item":"飲食|醫療與預防|用品|美容與訓練","low":整數新台幣,"high":整數新台幣,"note":"15字內"}],"matches":[{"type":"適合的毛孩類型，15字內，例：較能獨處的成貓","reason":"為什麼適合這位飼主的條件，45字內","adopt":true或false}]}

規則：risks 最多 3 項、依嚴重度排序，分數都在 75 以上時可以只給 1 項或空陣列；suggestions 3–4 項；checklist 4–6 類、每類 2–4 項，依種類、年齡與居住條件個人化；costs 為第一年粗估區間。matches 給 2–3 項：依飼主的時間、空間、預算、家庭與經驗，建議比較合拍的毛孩類型，以體型、年齡、活動量、獨處能力等特性描述，不寫特定品種，也不提購買管道；若成年或已完成絕育與預防針的毛孩更適合，請把 adopt 設為 true，鼓勵考慮到收容所認養。即使飼主條件很好，也給出最合拍的類型。score 為五個面向的平均。`;
}
function normalize(o, rule){
  if (!o || typeof o!=="object") return null;
  const dims = DIMS.map((n,i)=>{
    const d = Array.isArray(o.dimensions) ? o.dimensions.find(x=>x&&x.name===n) : null;
    return {name:n, score: d && Number.isFinite(+d.score) ? clamp(+d.score,0,100) : rule.dimensions[i].score, comment: d && typeof d.comment==="string" ? d.comment : rule.dimensions[i].comment};
  });
  const score = clamp(dims.reduce((s,d)=>s+d.score,0)/dims.length,0,100);
  const strs = (x)=>Array.isArray(x)?x.filter(s=>typeof s==="string"&&s.trim()):[];
  const risks = Array.isArray(o.risks) ? o.risks.filter(r=>r&&typeof r.title==="string").slice(0,3).map(r=>({title:r.title,reason:String(r.reason||"")})) : rule.risks;
  const sugg = strs(o.suggestions).slice(0,4);

    return "依時程於第 7 天進行關懷";
  }
  if (c.level==="高風險") return c.status==="待聯繫" ? "48 小時內由專人電話聯繫，了解狀況並提供臨時照顧或送養資源" : "持續追蹤處理進度，確認毛孩已有妥善安置";
  if (c.level==="中風險") return c.status==="待聯繫" ? "3 天內傳送對應的照護建議，必要時轉介訓練師或獸醫" : "追蹤轉介後的改善狀況";
  return "持續依時程關懷";
}
function nextStatus(c){
  const flow = c.level==="低風險" ? FLOW_LOW : FLOW_RISK;
  const i = flow.indexOf(c.status);
  return i>=0 && i<flow.length-1 ? flow[i+1] : null;
}
const statusRank = s => ({"待聯繫":0,"已聯繫":1,"已轉介":2,"定期關懷":3,"已結案":4})[s] ?? 5;
const levelRank = l => ({"高風險":0,"中風險":1,"低風險":2})[l] ?? 3;
function fallbackScript(c){
  if (c.level==="高風險") return {opening:"您好，我是門市的店員，想關心一下毛孩最近的狀況。", points:["先聽飼主說明遇到的困難，不急著給建議","了解是否有搬家、經濟或家庭變動等時間壓力","提供臨時照顧、協助找新家等選項，避免直接棄養","約定下次聯繫或到店時間"], avoid:"避免指責或說「當初就不該養」"};
  return {opening:"您好，看到您回覆的狀況，想提供一些建議。", points:["確認狀況開始的時間與發生頻率","分享對應的照護或訓練方法","若持續沒有改善，建議轉介訓練師或獸醫","約定一週後再關心一次"], avoid:"避免直接判斷病因，健康問題一律建議就醫"};
}
async function makeScript(c, box, btn){
  btn.disabled = true; box.replaceChildren(el("span",{text:"產生中…"})); box.hidden = false;
  let s = null;
  if (sample && !aiBlocked){
    const prompt = `你是寵物用品門市的資深店長，要指導店員聯繫一位新手飼主，目標是在對方放棄飼養之前提供協助。用台灣繁體中文，語氣溫暖、不說教，不做醫療診斷，不推薦品牌或商品。
個案：毛孩 ${c.pet}；目前風險 ${c.level}；判讀訊號 ${c.signals.join("、")}；建議轉介 ${c.referral||"無"}；紀錄：${c.log.join("／")}
只回傳 JSON：{"opening":"電話開場白，40字內","points":["這通聯繫要了解或提供的重點，各30字內，3–4項"],"avoid":"要避免的說法，30字內"}`;
    try { const o = await sample.json(prompt,{modelTier:"quick"}); if (o && typeof o.opening==="string" && Array.isArray(o.points)) s = {opening:o.opening, points:o.points.filter(x=>typeof x==="string").slice(0,4), avoid:String(o.avoid||"")}; }
    catch(e){ if (e && e.code==="not_granted") aiBlocked = true; }
  }
  if (!s) s = fallbackScript(c);
  scriptCache[c.id] = s;
  fillScript(box, s); btn.disabled = false;
}
function fillScript(box, s){
  const ul = el("ul"); s.points.forEach(t=>ul.append(el("li",{text:t})));
  box.replaceChildren(el("div",{}, el("b",{text:"開場："}), s.opening), el("div",{}, el("b",{text:"聯繫重點："})), ul, s.avoid ? el("div",{}, el("b",{text:"避免："}), s.avoid) : null);
}
function renderStore(){
  clear();
  const open = cases.filter(c=>c.status!=="已結案");
  const todo = cases.filter(c=>c.status==="待聯繫");
  app.append(el("div",{class:"panel"},
    el("h1",{style:"font-size:24px;margin:0 0 4px",text:"門市後台｜關懷個案"}),
    el("p",{class:"muted",style:"margin:0",text:"示範資料。個案以編號顯示，不顯示飼主姓名與電話。"}),
    el("div",{class:"kpis"},
      el("div",{class:"kpi"}, el("b",{text:String(open.length)}), el("span",{text:"追蹤中個案"})),
      el("div",{class:"kpi"}, el("b",{style:"color:var(--high)",text:String(todo.length)}), el("span",{text:"待聯繫"})),
      el("div",{class:"kpi"}, el("b",{text:String(cases.filter(c=>c.level==="高風險"&&c.status!=="已結案").length)}), el("span",{text:"高風險"})),
      el("div",{class:"kpi"}, el("b",{text:String(cases.filter(c=>c.status==="已轉介").length)}), el("span",{text:"已轉介"}))
    ),
    (()=>{ const f = el("div",{class:"filters",role:"group","aria-label":"篩選"});
      [["all","全部"],["todo","待聯繫"],["high","高風險"],["closed","已結案"]].forEach(([k,t])=>f.append(el("button",{type:"button",class:"chip","aria-pressed":storeFilter===k?"true":"false",onclick:()=>{storeFilter=k;renderStore();}},t)));
      return f; })()
  ));
  let list = cases.slice().sort((a,b)=>statusRank(a.status)-statusRank(b.status) || levelRank(a.level)-levelRank(b.level));
  if (storeFilter==="todo") list = list.filter(c=>c.status==="待聯繫");
  if (storeFilter==="high") list = list.filter(c=>c.level==="高風險");
  if (storeFilter==="closed") list = list.filter(c=>c.status==="已結案");
  if (!currentCase) app.append(el("p",{class:"muted",style:"margin-top:12px",text:"提示：切回飼主端完成一次評估與關懷回覆，你的示範個案會即時出現在這裡。"}));
  if (!list.length) app.append(el("p",{class:"muted",style:"margin-top:12px",text:"這個分類目前沒有個案。"}));
  list.forEach(c=>{
    const lv = c.level==="高風險"?"c-high":c.level==="中風險"?"c-mid":"c-low";
    const card = el("div",{class:"case "+lv},
      el("div",{class:"top"},
        el("span",{class:"cid",text:"#"+c.id}),
        el("span",{class:"level "+lvClass(c.level),text:c.level}),
        c.current ? el("span",{class:"tag-now",text:"本次示範"}) : null,
        el("span",{class:"status"+(c.status==="待聯繫"?" todo":""),text:c.status})
      ),
      el("p",{class:"meta",text:`${c.pet}｜${c.county}${c.store}｜評估 ${c.score} 分｜${c.day ? `第 ${c.day} 天關懷` : "剛完成評估"}`}),
      el("p",{class:"sig"}, el("b",{text:"判讀訊號："}), c.signals.join("、")),
      el("div",{class:"task"}, el("b",{text:"待處理："}), taskFor(c), c.referral && c.status!=="已結案" ? el("div",{}, el("b",{text:"建議轉介："}), c.referral) : null)
    );
    const acts = el("div",{class:"actions"});
    const nx = nextStatus(c);
    if (nx) acts.append(el("button",{class:"btn",onclick:()=>{ c.log.push(`店員更新狀態：${c.status} → ${nx}`); c.status=nx; renderStore(); }},`標記為${nx}`));
    const box = el("div",{class:"script",hidden:!scriptCache[c.id]});
    if (scriptCache[c.id]) fillScript(box, scriptCache[c.id]);
    if (c.level!=="低風險" && c.status!=="已結案"){
      const b = el("button",{class:"btn ghost"},"產生聯繫重點");
      b.addEventListener("click",()=>makeScript(c, box, b));
      acts.append(b);
    }
    if (acts.childNodes.length) card.append(acts);
    card.append(box);
    if (c.referral && c.status!=="已結案") card.append(el("details",{}, el("summary",{text:`${c.county}轉介資源`}), resourceCards(c.county, refCat(c.referral))));
    const ul = el("ul"); c.log.forEach(t=>ul.append(el("li",{text:t})));
    card.append(el("details",{}, el("summary",{text:`關懷紀錄（${c.log.length}）`}), ul));
    app.append(card);
  });
}

renderWelcome();
})();
</script>
